[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-spectro"
version = "0.9.4"
description = "High-performance spectral frontends for Apple MLX: STFT/iSTFT, mel, descriptors, and hybrid CQT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ssmall256", email = "ssmall256@users.noreply.github.com" }]
keywords = ["mlx", "stft", "istft", "spectral", "audio", "dsp", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mlx>=0.31.2",
    "numpy",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "build"]
# The cross-framework parity tests are the only thing that validates the
# librosa/torchaudio-compatible surfaces against their references. Without
# these they are skipped, and a suite that skips them is green whether or not
# the parity holds -- which is how `mel_filterbank_librosa` shipped with no
# executed test at all. Install this extra in CI, not `dev`.
parity = [
    "pytest>=7.0",
    "librosa>=0.10",
    "torch>=2.0",
    "torchaudio>=2.0",
    "scipy>=1.10",
    "soxr>=0.3",
]
benchmark = ["torch>=2.0", "mlx-stft"]

[project.urls]
Homepage = "https://github.com/ssmall256/mlx-spectro"
Repository = "https://github.com/ssmall256/mlx-spectro"
Issues = "https://github.com/ssmall256/mlx-spectro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_spectro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
